apiVersion: v1
kind: ConfigMap
metadata:
  name: go2rtc-config
  namespace: camviewer
data:
  # Keep in sync with /go2rtc.yaml in the repo. The API can create exec: sources, so it
  # listens on loopback only and is reachable solely through the app's allowlisted proxy.
  go2rtc.yaml: |
    api:
      listen: "127.0.0.1:1984"
    rtsp:
      listen: "127.0.0.1:8554"
    # WebRTC media only (signaling still goes through the app's authenticated WebSocket proxy).
    # hostPort 8555 TCP+UDP on the node; the candidate tells browsers on the home LAN where to send.
    # Off the LAN (no router forward) WebRTC fails and the player keeps using MSE.
    webrtc:
      listen: ":8555"
      candidates:
        - 192.168.1.2:8555
      ice_servers: []
    srtp:
      listen: ""
    log:
      level: info
