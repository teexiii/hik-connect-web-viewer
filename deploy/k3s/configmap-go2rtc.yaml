apiVersion: v1
kind: ConfigMap
metadata:
  name: go2rtc-config
  namespace: camviewer
data:
  # Keep in sync with /go2rtc.yaml in the repo. The API can create exec: sources, so it
  # listens on loopback only and is reachable solely through the app's allowlisted proxy.
  go2rtc.yaml: |
    api:
      listen: "127.0.0.1:1984"
    rtsp:
      listen: "127.0.0.1:8554"
    # WebRTC media only (signaling still goes through the app's authenticated WebSocket proxy).
    # hostPort 61873 TCP+UDP on the node (above the Linux ephemeral range), forwarded from the WAN
    # by the router. Candidates: the LAN address for home viewers, cam.ult.vn (dynamic-DNS public
    # IP) for viewers on 4G. If WebRTC cannot connect the player keeps using MSE.
    webrtc:
      listen: ":61873"
      candidates:
        - 192.168.1.2:61873
        - cam.ult.vn:61873
      ice_servers: []
    srtp:
      listen: ""
    log:
      level: info
