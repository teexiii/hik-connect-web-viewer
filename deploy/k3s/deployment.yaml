apiVersion: apps/v1
kind: Deployment
metadata:
  name: camviewer
  namespace: camviewer
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: camviewer
  template:
    metadata:
      labels:
        app: camviewer
    spec:
      securityContext:
        fsGroup: 10001
      containers:
        - name: app
          image: __APP_IMAGE__
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          env:
            - name: DATA_DIR
              value: /data
            - name: COOKIE_SECURE
              value: "true"
            # Traffic arrives from the node/CNI address behind nginx + Cloudflare, so trust the
            # forwarded headers from any peer (the NodePort is LAN-only).
            - name: FORWARDED_ALLOW_IPS
              value: "*"
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef: {name: camviewer-secrets, key: SESSION_SECRET}
            - name: APP_USERNAME
              valueFrom:
                secretKeyRef: {name: camviewer-secrets, key: APP_USERNAME}
            - name: APP_PASSWORD_HASH
              valueFrom:
                secretKeyRef: {name: camviewer-secrets, key: APP_PASSWORD_HASH}
            - name: HIK_CONNECT_USER
              valueFrom:
                secretKeyRef: {name: camviewer-secrets, key: HIK_CONNECT_USER}
            - name: HIK_CONNECT_PASSWORD
              valueFrom:
                secretKeyRef: {name: camviewer-secrets, key: HIK_CONNECT_PASSWORD}
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet: {path: /healthz, port: 8080}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /healthz, port: 8080}
            initialDelaySeconds: 20
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {memory: 512Mi}
        - name: go2rtc
          image: __GO2RTC_IMAGE__
          imagePullPolicy: Never
          # go2rtc rewrites its config when streams are registered over the API, so it runs
          # from a writable copy of the ConfigMap template.
          command: ["/bin/sh", "-c"]
          args:
            - cp /config-src/go2rtc.yaml /config/go2rtc.yaml && exec /sbin/tini -- go2rtc -config /config/go2rtc.yaml
          volumeMounts:
            - name: go2rtc-config
              mountPath: /config-src
              readOnly: true
            - name: go2rtc-work
              mountPath: /config
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 384Mi}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: camviewer-data
        - name: go2rtc-config
          configMap:
            name: go2rtc-config
        - name: go2rtc-work
          emptyDir: {}
