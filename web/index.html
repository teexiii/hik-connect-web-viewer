<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0e1116">
  <title>Camera</title>
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <header class="bar">
    <h1>Camera</h1>
    <button id="menu-button" class="icon" aria-label="Tuỳ chọn">⋯</button>
    <div id="menu" class="menu" hidden>
      <div id="offline-list" class="offline-list" hidden></div>
      <button id="logout">Đăng xuất</button>
    </div>
  </header>
  <div id="banner" class="banner" role="alert" hidden>
    <span id="banner-text"></span>
    <button id="banner-retry">Thử lại</button>
  </div>
  <main id="grid" class="grid" aria-live="polite">Đang tải…</main>

  <section id="viewer" class="viewer" hidden>
    <div class="viewer-top">
      <button class="back icon" aria-label="Quay lại">←</button>
      <span class="title"></span>
      <span class="status"></span>
    </div>
    <div class="live"></div>
    <button class="retry" hidden>Thử lại</button>
    <div class="viewer-bottom">
      <div class="toast" role="status"></div>
      <div class="actions">
        <button class="refresh">Làm mới</button>
        <button class="snapshot">Chụp ảnh</button>
        <span class="clip-group">
          <select class="clip-seconds" aria-label="Độ dài clip">
            <option value="10">10 giây</option>
            <option value="30" selected>30 giây</option>
            <option value="60">60 giây</option>
          </select>
          <button class="clip">Ghi clip</button>
        </span>
      </div>
    </div>
  </section>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
