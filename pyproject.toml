[project]
name = "camviewer"
version = "0.1.0"
description = "Mobile web viewer for Hik-Connect cloud cameras"
requires-python = ">=3.12"
dependencies = [
    "hikcloudstream[viewer]==0.1.4",
    "pyezvizapi>=1.0.4.5,<2",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "httpx>=0.27",
    "websockets>=13",
    "itsdangerous>=2.2",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.7",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["web/vendor", "spike-out", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.setuptools]
packages = ["camviewer"]
